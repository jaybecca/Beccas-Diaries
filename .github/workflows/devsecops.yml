name: Beccas Diaries DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website and Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -eu
          test -f index.html
          test -f article.html
          test -f admin.html
          test -d assets
          test -d css
          test -d js
          test -f functions/api/media.js
          test -f worker.js
          test -f wrangler.toml
          test -f .assetsignore
          test -f supabase/media-complete-migration.sql
          echo "Required website and Worker files are present."

      - name: Check JavaScript syntax
        run: |
          set -eu
          find js functions -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              node --check "$file"
            done
          node --check worker.js

      - name: Check JSON configuration syntax
        run: |
          set -eu
          find . -type f -name '*.json' \
            -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              node -e \
                'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' \
                "$file"
            done

  secret-scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2

  security-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs:
      - validate
      - secret-scan
      - security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Worker and website assets
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
